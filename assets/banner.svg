<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: flow 4s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 10 20;
        animation: flowRev 6s linear infinite;
      }
      .scan-beam {
        animation: scan 5s ease-in-out infinite alternate;
      }
      .log-packet {
        animation: emit 3s infinite ease-in-out;
      }
      .tag-chip {
        transition: transform 0.3s ease;
      }

      @keyframes flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      @keyframes flowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulse1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
        100% { transform: translate(50px, 20px) scale(1.25); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        100% { transform: translate(-40px, -30px) scale(1.2); opacity: 0.55; }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0.2; }
      }
      @keyframes emit {
        0% { r: 3; opacity: 0.3; }
        50% { r: 6; opacity: 1; }
        100% { r: 3; opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle cx="200" cy="120" r="260" fill="url(#orb-blue)" class="glow-orb-1" />
  <circle cx="1020" cy="280" r="280" fill="url(#orb-purple)" class="glow-orb-2" />

  <!-- Geometric Grid Texture -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Log Data Ingestion Streams (Background telemetry layer) -->
  <g opacity="0.65">
    <!-- Log stream pipeline 1 -->
    <path d="M -50,90 Q 300,160 600,90 T 1250,110" fill="none" stroke="url(#line-grad)" stroke-width="2" class="stream-line" />
    <path d="M -50,310 Q 350,220 700,310 T 1250,280" fill="none" stroke="url(#line-grad)" stroke-width="2" class="stream-line-rev" />
    <path d="M 100,-20 Q 250,200 400,420" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" />
    <path d="M 800,-20 Q 950,200 1100,420" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.25" class="stream-line-rev" />

    <!-- Pulse nodes on stream lines -->
    <circle cx="300" cy="130" fill="#60a5fa" class="log-packet" />
    <circle cx="600" cy="90" fill="#a855f7" class="log-packet" style="animation-delay: 1s;" />
    <circle cx="900" cy="100" fill="#38bdf8" class="log-packet" style="animation-delay: 2s;" />
    <circle cx="350" cy="265" fill="#ec4899" class="log-packet" style="animation-delay: 1.5s;" />
    <circle cx="700" cy="310" fill="#818cf8" class="log-packet" style="animation-delay: 0.5s;" />
  </g>

  <!-- Horizontal Scanning Beam (Observability Search simulation) -->
  <line x1="80" y1="90" x2="1120" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 12" class="scan-beam" />

  <!-- Center Card Backdrop (guarantees crystal-clear foreground text legibility) -->
  <rect x="120" y="55" width="960" height="290" rx="24" fill="#0d1424" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Header Pill inside Card -->
  <g transform="translate(435, 78)">
    <rect width="330" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED OBSERVABILITY ECOSYSTEM</text>
  </g>

  <!-- MAIN FOREGROUND TEXT (Unobscured & crisp) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primary-glow)" letter-spacing="-0.5">
    Awesome Log Aggregation &amp; Management
  </text>

  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    High-Performance Log Analytics, Stream Ingestion &amp; Self-Hosted Pipelines
  </text>

  <!-- Feature Badges / Capability Pills inside safe foreground zone -->
  <g transform="translate(225, 245)">
    <!-- Pill 1: Centralized Indexing -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
      <text x="82" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">⚡ Log Ingestion</text>
    </g>
    <!-- Pill 2: Open Source & Self-Hosted -->
    <g transform="translate(180, 0)">
      <rect width="180" height="36" rx="18" fill="#064e3b" stroke="#059669" stroke-width="1.2" />
      <text x="90" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">📦 Open Source &amp; OSS</text>
    </g>
    <!-- Pill 3: Enterprise SaaS -->
    <g transform="translate(375, 0)">
      <rect width="180" height="36" rx="18" fill="#4a044e" stroke="#c026d3" stroke-width="1.2" />
      <text x="90" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f0abfc">☁️ Enterprise SaaS</text>
    </g>
    <!-- Pill 4: Real-time Telemetry -->
    <g transform="translate(570, 0)">
      <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="90" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🔍 Sub-Second Search</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(380, 310)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Verified Pricing</text>
    <circle cx="130" cy="0" r="4" fill="#ec4899" />
    <text x="142" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Transparent Free Tiers</text>
    <circle cx="310" cy="0" r="4" fill="#10b981" />
    <text x="322" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">GitHub Stars Tracked</text>
  </g>
</svg>
